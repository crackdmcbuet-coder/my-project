<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>শব্দমূল অভিধান</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f5f0; --card:#ffffff; --ink:#1f2328; --muted:#5f6670; --line:#e4e0d8;
  --accent:#0f766e; --accent-soft:#e6f4f2;
  --err:#c62828; --err-soft:#fdecec;
  --ok:#2e7d32; --ok-soft:#e8f5e9;
  --warn:#b26a00; --warn-soft:#fff4e0;
  --mn:#6a1b9a; --mn-soft:#f4ecfa;
  --fig:#ffffff;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15171a; --card:#1e2125; --ink:#e8e6e1; --muted:#a3a9b1; --line:#30343a;
    --accent:#4fd1c5; --accent-soft:#163633;
    --err:#ff6b6b; --err-soft:#3a1d1f;
    --ok:#66bb6a; --ok-soft:#1b2e1d;
    --warn:#ffb74d; --warn-soft:#352a17;
    --mn:#ce93d8; --mn-soft:#2c2033;
    --fig:#f4f1ea;
  }
}
:root[data-theme="dark"]{
  --bg:#15171a; --card:#1e2125; --ink:#e8e6e1; --muted:#a3a9b1; --line:#30343a;
  --accent:#4fd1c5; --accent-soft:#163633;
  --err:#ff6b6b; --err-soft:#3a1d1f;
  --ok:#66bb6a; --ok-soft:#1b2e1d;
  --warn:#ffb74d; --warn-soft:#352a17;
  --mn:#ce93d8; --mn-soft:#2c2033;
  --fig:#f4f1ea;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Hind Siliguri","Noto Sans Bengali","Kalpurush",system-ui,sans-serif;
  font-size:17px;line-height:1.75}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 80px}
header{padding:18px 0 6px}
header h1{font-size:1.5rem;line-height:1.3;margin:0 0 2px}
header .sub{color:var(--muted);font-size:.9rem}
.versions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;font-size:.85rem}
.versions a{color:var(--accent);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:2px 10px;background:var(--card)}
.versions a.cur{background:var(--accent);color:#fff;border-color:var(--accent)}
.stats{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;font-size:.82rem}
.pill{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:1px 9px;white-space:nowrap}
.chips{display:flex;gap:6px;overflow-x:auto;padding:6px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip,button.btn{font:inherit;font-size:.85rem;border:1px solid var(--line);background:var(--card);
  color:var(--ink);border-radius:999px;padding:4px 12px;cursor:pointer;white-space:nowrap;flex:0 0 auto}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}
.card h2{font-size:1.15rem;margin:0 0 8px;line-height:1.45}
.topic-h{margin:28px 0 4px;font-size:1.3rem}
figure{margin:10px 0;text-align:center}
figure svg{width:100%;max-width:560px;height:auto;border-radius:10px;background:var(--fig)}
figure svg text{fill-opacity:1}
figcaption{font-size:.82rem;color:var(--muted);margin-top:4px}
.err{color:var(--err);background:var(--err-soft);border-radius:4px;padding:0 3px;font-weight:600}
.k{font-weight:600;color:var(--accent)}
.err .k{color:inherit}
body.recall .k{background:var(--ink);color:transparent;border-radius:4px;cursor:pointer;user-select:none}
body.recall .k.show{background:transparent;color:var(--accent)}
.box{border-radius:10px;padding:10px 12px;margin:10px 0;font-size:.95rem}
.box b.t{display:block;font-size:.82rem;margin-bottom:2px}
.why{background:var(--accent-soft)} .why b.t{color:var(--accent)}
.mn{background:var(--mn-soft)} .mn b.t{color:var(--mn)}
.story{border:1px dashed var(--mn)} .story b.t{color:var(--mn)}
.trap{background:var(--warn-soft)} .trap b.t{color:var(--warn)}
.trap ul{margin:4px 0 0;padding-left:20px}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:600}
td.err,b.err{display:table-cell}
b.err{display:inline}
mark.cue{background:transparent;color:inherit;border-bottom:3px solid #f9a825;padding:0 1px}
.showcue mark.cue{background:#fff59d;color:#1f2328;border-radius:3px}
.hintbox{background:#fff8e1;color:#5d4037;border-left:4px solid #f9a825}
.hintbox b.t{color:#e65100}
.empty{color:var(--muted);text-align:center;padding:30px 0}
.muted{color:var(--muted)}
[hidden]{display:none!important}
@media (prefers-reduced-motion: reduce){ svg *{animation:none!important} }

.search{width:100%;font:inherit;font-size:1rem;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
.root{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;background:var(--card)}
.root .head{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline}
.root .w{font-weight:700;font-size:1.1rem}
.root .lang{font-size:.75rem;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:0 8px}
.root .m{font-weight:600;color:var(--accent)}
body.quizmode .root .m,body.quizmode .root .det{filter:blur(6px);cursor:pointer}
body.quizmode .root.show .m,body.quizmode .root.show .det{filter:none}
.root .det{font-size:.88rem;margin-top:4px}
.root .det div{margin:2px 0}
.inbook a{color:var(--accent);text-decoration:none;border-bottom:1px dotted}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🔤 শব্দমূল অভিধান</h1>
    <div class="sub">গ্রিক, ল্যাটিন আর সংস্কৃত মূল। একবার শিখলে সব অধ্যায়ে আর মেডিকেলে কাজে লাগবে। নতুন অধ্যায় যোগ হলে এই তালিকাও বড় হবে।</div>
    <div class="chips"><button class="chip" data-v="roots" aria-pressed="true">মূল (root)</button><button class="chip" data-v="terms" aria-pressed="false">বইয়ের শব্দ ভাঙা</button>
      <button class="chip" id="quizBtn" aria-pressed="false">🙈 মানে লুকাও (নিজেকে যাচাই)</button></div>
    <input class="search" id="q" placeholder="খোঁজো: lysis, আলো, cyto, স্বেদ…" autocomplete="off">
    <div class="muted" id="count" style="font-size:.85rem;margin-top:4px"></div>
  </header>
  <div id="out"></div>
</div>
<script>
/* 🔤 শব্দমূল অভিধান: সব অধ্যায়ে শেয়ার করা।
   key: {w: মূল রূপ, lang, m: মানে, also: সাধারণ শব্দে, med: মেডিকেলে/অন্য অধ্যায়ে}
   নতুন অধ্যায়ে নতুন মূল লাগলে এখানেই যোগ করো; পুরনোগুলো আবার ব্যবহার হবে। */
const ROOTS = {
  // ---------- আলো, রং ----------
  photo:   {w:"phōs, phōtos", lang:"গ্রিক", m:"আলো", also:["photograph","photon"], med:["photophobia: আলো সহ্য না হওয়া (মেনিনজাইটিস, মাইগ্রেন)","phototherapy: নবজাতকের জন্ডিসে নীল আলো"]},
  phor:    {w:"phoros", lang:"গ্রিক", m:"বহনকারী", also:["semaphore"], med:["phosphorus = phōs + phoros = আলো-বহনকারী (অন্ধকারে জ্বলে)"]},
  chloro:  {w:"chlōros", lang:"গ্রিক", m:"হালকা সবুজ / হলদে-সবুজ", also:["chlorine (হলদে-সবুজ গ্যাস)"], med:["chloroma: সবুজাভ টিউমার (লিউকেমিয়ায়)","hypochloremia: রক্তে Cl⁻ কম"]},

  flav:    {w:"flavus", lang:"ল্যাটিন", m:"হলুদ", also:["riboflavin (ভিটামিন B₂, হলুদ)"], med:["flavivirus: ইয়েলো ফিভার/ডেঙ্গুর ভাইরাস পরিবার"]},

  bili:    {w:"bilis", lang:"ল্যাটিন", m:"পিত্ত", also:["bilin রঞ্জক"], med:["bilirubin: পিত্তের লাল রঞ্জক (জন্ডিস)","biliary colic"]},

  syn:     {w:"syn", lang:"গ্রিক", m:"একসাথে", also:["synonym","synchronize","synthase"], med:["syndrome: একসাথে চলা উপসর্গ","synapse"]},
  thesis:  {w:"thesis", lang:"গ্রিক", m:"বসানো / স্থাপন", also:["thesis","synthesis = একসাথে বসানো = তৈরি"], med:["prosthesis: কৃত্রিম অঙ্গ বসানো"]},

  gen:     {w:"-genēs", lang:"গ্রিক", m:"উৎপাদক / জন্মদাতা", also:["hydrogen","oxygen","gene"], med:["pathogen: রোগ-উৎপাদক","carcinogen"]},

  hexa:    {w:"hex", lang:"গ্রিক", m:"ছয়", also:["hexagon","hexose (৬C চিনি)"], med:[]},
  tri:     {w:"tri", lang:"গ্রিক/ল্যাটিন", m:"তিন", also:["triangle","tricarboxylic"], med:["triceps: তিন মাথার পেশি","triglyceride"]},
  bis:     {w:"bis / di", lang:"ল্যাটিন/গ্রিক", m:"দুই", also:["bisphosphate","diphosphate (একই মানে)","bicycle"], med:["biceps: দুই মাথার পেশি"]},
  mono:    {w:"monos", lang:"গ্রিক", m:"এক", also:["monomer"], med:["mononucleosis"]},

  // ---------- কোষ, গঠন ----------

  meso:    {w:"mesos", lang:"গ্রিক", m:"মাঝখান", also:["mesophyll","Mesopotamia (দুই নদীর মাঝে)"], med:["mesoderm","mesentery"]},

  phyte:   {w:"phyton", lang:"গ্রিক", m:"উদ্ভিদ", also:["xerophyte","hydrophyte"], med:["dermatophyte: ত্বকের ছত্রাক","osteophyte: হাড়ে কাঁটা"]},
  stoma:   {w:"stoma, stomata", lang:"গ্রিক", m:"মুখ", also:["পাতার মুখ = পত্ররন্ধ্র"], med:["stomatitis: মুখে ঘা","colostomy: পেটে কৃত্রিম মুখ"]},
  cutis:   {w:"cutis → cuticula", lang:"ল্যাটিন", m:"চামড়া → ছোট চামড়া", also:["cuticle","cutin"], med:["subcutaneous: চামড়ার নিচে (s.c. ইনজেকশন)"]},
  lens:    {w:"lens, lentis", lang:"ল্যাটিন", m:"মসুর ডাল", also:["lenticel (মসুর দানার মতো ছিদ্র)","চোখের lens (মসুর দানার আকার)"], med:["lenticular"]},
  hodos:   {w:"hodos", lang:"গ্রিক", m:"পথ", also:["hydathode = পানির পথ","electrode","method"], med:["anode/cathode"]},
  kranz:   {w:"Kranz", lang:"জার্মান", m:"মালা / পুষ্পমাল্য", also:["Kranz anatomy: বান্ডলশীথকে ঘিরে মেসোফিলের মালা"], med:[]},

/* 🔤 Word-root rendering, shared by every page (needs ROOTS). */
const isBn = k => k.startsWith("bn_");
function rootChip(k) {
  const r = ROOTS[k]; if (!r) return "";
  return `<span class="rc${isBn(k) ? " bn" : ""}"><b>${r.w}</b><small>${r.lang}</small><i>${r.m}</i></span>`;
}
function termHTML(t, id) {
  const fx = t.p.filter(k => !isBn(k)), bn = t.p.filter(isBn);
  const extra = t.p.filter(k => ROOTS[k] && (ROOTS[k].med.length || ROOTS[k].also.length));
  return `<div class="term" ${id ? `id="${id}"` : ""}>
    <div class="tt">${t.t} <span class="bnname">${t.bn}</span></div>
    ${fx.length ? `<div class="eq">${fx.map(rootChip).join('<span class="plus">+</span>')}</div>` : ""}
    <div class="lit">= “${t.lit}”</div>
    ${t.bnp || bn.length ? `<div class="bnp">🇧🇩 ${t.bnp || ""} ${bn.map(rootChip).join(" ")}</div>` : ""}
    <div class="fact">💡 তাই মনে রাখো: ${t.fact}</div>
    ${extra.length ? `<details><summary>এই মূলগুলো আর কোথায় পাবে (মেডিকেলেও)</summary><ul>${extra.map(k => {
      const r = ROOTS[k]; return `<li><b>${r.w}</b> (${r.m}): ${r.also.concat(r.med.map(m => "🩺 " + m)).join(" · ")}</li>`; }).join("")}</ul></details>` : ""}
  </div>`;
}
const TERM_CSS = `
.term{border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0;background:var(--card)}
.term .tt{font-weight:700;font-size:1.08rem}
.term .bnname{font-weight:500;color:var(--muted);font-size:.92rem}
.eq{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:8px 0}
.plus{font-weight:700;color:var(--muted)}
.rc{display:inline-flex;flex-direction:column;align-items:center;border-radius:10px;padding:4px 10px;background:#e3f2fd;color:#0d47a1;line-height:1.25;text-align:center}
.rc.bn{background:#fce4ec;color:#880e4f}
.rc b{font-size:.98rem}.rc small{font-size:.66rem;opacity:.75}.rc i{font-style:normal;font-size:.8rem;font-weight:600}
.lit{font-weight:600;color:var(--accent)}
.bnp{margin-top:6px;font-size:.92rem}
.fact{margin-top:6px;font-size:.92rem;background:var(--accent-soft);border-radius:8px;padding:6px 8px}
.term details{margin-top:6px;font-size:.85rem;color:var(--muted)}
.term summary{cursor:pointer}
.termchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.termchips .chip{font-size:.8rem}
`;
document.head.insertAdjacentHTML("beforeend", `<style>${TERM_CSS}</style>`);

(function(){
  const $ = s => document.querySelector(s);
  let view = "roots";
  const usedIn = k => TERMS.filter(t => t.p.includes(k));
  function rootCard(k) {
    const r = ROOTS[k], u = usedIn(k);
    return `<div class="root" data-k="${k}"><div class="head"><span class="w">${r.w}</span><span class="lang">${r.lang}</span><span class="m">= ${r.m}</span></div>
      <div class="det">
        ${u.length ? `<div class="inbook">📘 বইয়ে: ${u.map(t => `<a href="${t.chapterId}-study.html">${t.t}</a>`).join(", ")}</div>` : ""}
        ${r.also.length ? `<div>🔁 আরও: ${r.also.join(" · ")}</div>` : ""}
        ${r.med.length ? `<div>🩺 মেডিকেলে: ${r.med.join(" · ")}</div>` : ""}
      </div></div>`;
  }
  function render() {
    const q = $("#q").value.trim().toLowerCase();
    const hit = s => !q || s.toLowerCase().includes(q);
    if (view === "roots") {
      const ks = Object.keys(ROOTS).filter(k => { const r = ROOTS[k]; return hit([r.w, r.m, r.lang, ...r.also, ...r.med].join(" ")); });
      $("#count").textContent = `${ks.length}টি মূল`;
      $("#out").innerHTML = ks.map(rootCard).join("") || `<div class="empty">কিছু পাওয়া যায়নি</div>`;
    } else {
      const ts = TERMS.filter(t => hit([t.t, t.bn, t.lit, t.fact, t.bnp || ""].join(" ")));
      $("#count").textContent = `${ts.length}টি শব্দ`;
      $("#out").innerHTML = ts.map(t => termHTML(t) .replace('<div class="tt">', `<div class="muted" style="font-size:.75rem">${t.chapter}</div><div class="tt">`)).join("") || `<div class="empty">কিছু পাওয়া যায়নি</div>`;
    }
  }
  document.querySelectorAll("[data-v]").forEach(b => b.onclick = () => {
    view = b.dataset.v; document.querySelectorAll("[data-v]").forEach(x => x.setAttribute("aria-pressed", x === b)); render(); });
  $("#quizBtn").onclick = function () { const on = document.body.classList.toggle("quizmode"); this.setAttribute("aria-pressed", on); };
  $("#out").addEventListener("click", e => { const r = e.target.closest(".root"); if (r && document.body.classList.contains("quizmode")) r.classList.toggle("show"); });
  $("#q").oninput = render;
  render();
})();
</script>
