<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chemistry 1st Paper – MCQ Exam</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--tx:#1c2430;--mut:#64707f;--pri:#2563eb;--ok:#16a34a;--bad:#dc2626;--warn:#f59e0b;--bd:#dfe4ec}
@media(prefers-color-scheme:dark){:root{--bg:#10151c;--card:#19212b;--tx:#e6ebf2;--mut:#93a0b1;--bd:#2a3543}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 "Noto Sans Bengali","Hind Siliguri",system-ui,sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:14px}
h1{font-size:1.35rem;margin:.2rem 0}h2{font-size:1.1rem;margin:0 0 .6rem}
.mut{color:var(--mut);font-size:.9rem}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:9px 16px}
button.pri{background:var(--pri);border-color:var(--pri);color:#fff}
button.danger{background:var(--bad);border-color:var(--bad);color:#fff}
button:disabled{opacity:.45;cursor:default}
input[type=number]{font:inherit;width:90px;padding:7px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.timer{font-weight:700;font-variant-numeric:tabular-nums;font-size:1.15rem;padding:6px 14px;border-radius:10px;background:var(--card);border:1px solid var(--bd)}
.timer.low{color:var(--bad);border-color:var(--bad)}
.qtext{font-size:1.1rem;font-weight:600;margin-bottom:12px}
.opt{display:flex;gap:12px;align-items:center;padding:11px 12px;border:1.5px solid var(--bd);border-radius:12px;margin:8px 0;cursor:pointer}
.opt:hover{border-color:var(--pri)}
.opt .l{flex:none;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--mut);display:grid;place-items:center;font-size:.85rem;font-weight:600}
.opt.sel{border-color:var(--pri);background:color-mix(in srgb,var(--pri) 10%,transparent)}
.opt.sel .l{background:var(--pri);border-color:var(--pri);color:#fff}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.nav{display:flex;justify-content:space-between;gap:8px;margin-top:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.grid button{padding:6px 0;font-size:.85rem}
.grid .ans{background:var(--pri);color:#fff;border-color:var(--pri)}
.grid .flag{outline:2px solid var(--warn)}
.grid .cur{box-shadow:0 0 0 2px var(--tx)}
.grid .r{background:var(--ok);border-color:var(--ok);color:#fff}
.grid .w{background:var(--bad);border-color:var(--bad);color:#fff}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:var(--bg);border-radius:12px;padding:12px;text-align:center}
.stat b{display:block;font-size:1.5rem}
sup,sub{line-height:0}
.hide{display:none}
.badge{display:inline-block;font-size:.8rem;padding:1px 8px;border-radius:99px;border:1px solid var(--bd);margin-left:6px}
</style>
</head>
<body>
<div class="wrap">
<div id="setup" class="card">
  <h1>Medical Admission 2026 – Chemistry 1st Paper</h1>
  <div class="mut">MCQ Master Set: 1 · ১০০টি প্রশ্ন</div>
  <p>প্রতিটি সঠিক উত্তরে <b>+১</b>, প্রতিটি ভুল উত্তরে <b>−০.২৫</b>। উত্তর না দিলে কোনো নম্বর কাটা যাবে না।</p>
  <p>সময় (মিনিট): <input id="mins" type="number" min="1" max="300" value="60"></p>
  <button class="pri" onclick="start()">পরীক্ষা শুরু করুন</button>
</div>

<div id="exam" class="hide">
  <div class="top">
    <div class="mut" id="prog"></div>
    <div class="timer" id="timer">--:--</div>
    <button class="danger" onclick="finish(true)">জমা দিন</button>
  </div>
  <div class="card" id="qcard"></div>
  <div class="card"><h2>প্রশ্ন নেভিগেটর</h2><div class="grid" id="navgrid"></div>
    <div class="mut" style="margin-top:8px">নীল = উত্তর দেওয়া · হলুদ বর্ডার = রিভিউ চিহ্নিত</div></div>
</div>

<div id="result" class="hide">
  <div class="card"><h1>ফলাফল</h1>
    <div class="stats" id="stats"></div>
    <p style="margin-top:14px"><button class="pri" onclick="location.reload()">আবার দিন</button></p>
  </div>
  <div class="card"><h2>রিভিউ</h2><div class="grid" id="rgrid"></div></div>
  <div id="review"></div>
</div>
</div>

function render(){
  const q=Q[cur];
  $("prog").textContent="প্রশ্ন "+(cur+1)+" / "+Q.length+" · উত্তর দিয়েছেন "+ans.filter(a=>a>=0).length;
  $("qcard").innerHTML='<div class="qtext">'+(cur+1)+'. '+q[0]+(flag[cur]?'<span class="badge">রিভিউ</span>':'')+'</div>'+
    q[1].map((o,i)=>'<div class="opt'+(ans[cur]===i?' sel':'')+'" onclick="pick('+i+')"><span class="l">'+L[i]+'</span><span>'+o+'</span></div>').join("")+
    '<div class="nav"><button onclick="go(-1)" '+(cur?'':'disabled')+'>← আগের</button>'+
    '<span><button onclick="clr()">মুছুন</button> <button onclick="fl()">'+(flag[cur]?'রিভিউ সরান':'রিভিউ')+'</button></span>'+
    '<button class="pri" onclick="go(1)" '+(cur<Q.length-1?'':'disabled')+'>পরের →</button></div>';
  $("navgrid").innerHTML=Q.map((_,i)=>'<button class="'+(ans[i]>=0?'ans ':'')+(flag[i]?'flag ':'')+(i===cur?'cur':'')+'" onclick="jump('+i+')">'+(i+1)+'</button>').join("");
}
function pick(i){ans[cur]=(ans[cur]===i?-1:i);render();}
function clr(){ans[cur]=-1;render();}
function fl(){flag[cur]=!flag[cur];render();}
function go(d){cur=Math.min(Q.length-1,Math.max(0,cur+d));render();window.scrollTo(0,0);}
function jump(i){cur=i;render();window.scrollTo(0,0);}
document.addEventListener("keydown",e=>{
  if(done||$("exam").classList.contains("hide"))return;
  if(e.key==="ArrowRight")go(1); else if(e.key==="ArrowLeft")go(-1);
  else if("1234".includes(e.key)&&e.key.length===1)pick(+e.key-1);
});

function finish(ask){
  if(ask){const un=ans.filter(a=>a<0).length;
    if(!confirm(un?un+"টি প্রশ্নের উত্তর দেননি। জমা দিতে চান?":"পরীক্ষা জমা দিতে চান?"))return;}
  done=true; clearInterval(tm);
  let c=0,w=0,u=0; ans.forEach((a,i)=>{if(a<0)u++;else if(a===Q[i][2])c++;else w++;});
  const ded=w*NEG, score=c-ded;
  $("exam").classList.add("hide"); $("result").classList.remove("hide");
  $("stats").innerHTML=
    '<div class="stat"><b>'+score.toFixed(2)+' / '+Q.length+'</b>চূড়ান্ত নম্বর</div>'+
    '<div class="stat"><b style="color:var(--ok)">'+c+'</b>সঠিক</div>'+
    '<div class="stat"><b style="color:var(--bad)">'+w+'</b>ভুল (−'+ded.toFixed(2)+')</div>'+
    '<div class="stat"><b>'+u+'</b>উত্তর দেননি</div>';
  $("rgrid").innerHTML=Q.map((q,i)=>'<button class="'+(ans[i]<0?'':ans[i]===q[2]?'r':'w')+'" onclick="document.getElementById(\'rv'+i+'\').scrollIntoView()">'+(i+1)+'</button>').join("");
  $("review").innerHTML=Q.map((q,i)=>'<div class="card" id="rv'+i+'"><div class="qtext">'+(i+1)+'. '+q[0]+'</div>'+
    q[1].map((o,j)=>'<div class="opt'+(j===q[2]?' right':(j===ans[i]?' wrong':''))+'"><span class="l">'+L[j]+'</span><span>'+o+'</span></div>').join("")+
    (ans[i]<0?'<div class="mut">উত্তর দেওয়া হয়নি</div>':'')+'</div>').join("");
  window.scrollTo(0,0);
}
</script>
</body>
</html>
