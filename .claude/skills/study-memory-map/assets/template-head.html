<title>শৈবাল ছত্রাক লাইকেন মেমোরি ম্যাপ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Noto+Serif+Bengali:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@1,8..60,400;1,8..60,600&display=swap">
<style>
:root{
  --paper:#F5F6F1; --paper-2:#ECEEE7; --card:#FFFFFF; --ink:#17211C; --ink-2:#41504A;
  --ink-3:#6B7B74; --rule:#D6DBD3; --rule-2:#C2C9BE;
  --green:#1D6B4C; --green-soft:#E4EFE7;
  --brown:#8E5416; --brown-soft:#F3E9DC;
  --red:#A5303A; --red-soft:#F7E4E4;
  --gold:#93710A; --gold-soft:#F5EED6;
  --fire:#B8471C; --fire-soft:#FAE6DC;
  --teal:#166B6B; --teal-soft:#DFEDEC;
  --violet:#5B4090; --violet-soft:#EAE5F5;
  --shadow:0 1px 2px rgba(23,33,28,.06),0 6px 20px -12px rgba(23,33,28,.28);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#101613; --paper-2:#161E1A; --card:#18211D; --ink:#E3E9E3; --ink-2:#AFBCB4;
    --ink-3:#7F8F86; --rule:#28332D; --rule-2:#35423B;
    --green:#63C295; --green-soft:#162A20;
    --brown:#D3A163; --brown-soft:#2A2018;
    --red:#E88A90; --red-soft:#2C1A1C;
    --gold:#D6BC5C; --gold-soft:#282314;
    --fire:#EE9068; --fire-soft:#2C1B12;
    --teal:#5FBDBB; --teal-soft:#122726;
    --violet:#AF9BE4; --violet-soft:#1D1930;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -14px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --paper:#101613; --paper-2:#161E1A; --card:#18211D; --ink:#E3E9E3; --ink-2:#AFBCB4;
  --ink-3:#7F8F86; --rule:#28332D; --rule-2:#35423B;
  --green:#63C295; --green-soft:#162A20;
  --brown:#D3A163; --brown-soft:#2A2018;
  --red:#E88A90; --red-soft:#2C1A1C;
  --gold:#D6BC5C; --gold-soft:#282314;
  --fire:#EE9068; --fire-soft:#2C1B12;
  --teal:#5FBDBB; --teal-soft:#122726;
  --violet:#AF9BE4; --violet-soft:#1D1930;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -14px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:'Hind Siliguri',system-ui,sans-serif; font-size:16.5px; line-height:1.72;
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:1000px;margin:0 auto;padding:0 20px 120px}
h1,h2,h3,h4{font-family:'Noto Serif Bengali','Hind Siliguri',serif;text-wrap:balance;line-height:1.35;margin:0}
i,em,.sci{font-family:'Source Serif 4',Georgia,serif;font-style:italic}
b,strong{font-weight:600}
.org{font-weight:700;color:var(--green)}
code,.mono,.num{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}

/* ---------- masthead ---------- */
.mast{border-bottom:1px solid var(--rule);background:var(--paper-2)}
.mast-in{max-width:1000px;margin:0 auto;padding:34px 20px 26px;display:flex;flex-direction:column;gap:12px}
.eyebrow{font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:600;font-family:'IBM Plex Mono',monospace}
.mast h1{font-size:clamp(28px,5.2vw,42px);font-weight:700;letter-spacing:-.01em}
.mast p{margin:0;color:var(--ink-2);max-width:64ch;font-size:15.5px}
.src{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.src span{font-size:12px;font-family:'IBM Plex Mono',monospace;padding:4px 9px;border:1px solid var(--rule-2);border-radius:99px;color:var(--ink-3)}

/* ---------- nav ---------- */
nav{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--paper) 92%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--rule)}
.nav-in{max-width:1000px;margin:0 auto;display:flex;gap:6px;overflow-x:auto;padding:9px 14px;scrollbar-width:thin}
nav a{flex:0 0 auto;font-size:12.5px;font-family:'IBM Plex Mono',monospace;text-decoration:none;color:var(--ink-2);
  padding:5px 10px;border-radius:6px;border:1px solid transparent;white-space:nowrap}
nav a:hover,nav a:focus-visible{background:var(--green-soft);color:var(--green);border-color:var(--rule-2)}
nav a:focus-visible{outline:2px solid var(--green);outline-offset:1px}

/* ---------- part headers ---------- */
.part{margin:64px 0 0;scroll-margin-top:60px}
.part-head{display:flex;align-items:baseline;gap:14px;padding-bottom:10px;border-bottom:2px solid var(--ink);margin-bottom:22px}
.part-no{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;color:var(--green);letter-spacing:.06em}
.part-head h2{font-size:clamp(21px,3.4vw,27px);font-weight:700;flex:1}
.lede{color:var(--ink-2);font-size:15px;margin:-8px 0 22px;max-width:66ch}

h3{font-size:19px;font-weight:600;margin:34px 0 12px;padding-left:12px;border-left:3px solid var(--green)}
h4{font-size:16px;font-weight:600;margin:22px 0 8px;color:var(--ink-2)}

/* ---------- refs ---------- */
.ref{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-3);white-space:nowrap;
  border:1px solid var(--rule);border-radius:4px;padding:1px 5px;margin-left:4px;display:inline-block;
  vertical-align:1px;background:var(--paper-2)}

/* ---------- tables ---------- */
.tw{overflow-x:auto;border:1px solid var(--rule);border-radius:10px;margin:16px 0;background:var(--card);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:14.5px}
th,td{text-align:left;padding:9px 13px;border-bottom:1px solid var(--rule);vertical-align:top;line-height:1.55}
th{background:var(--paper-2);font-weight:600;font-size:13px;letter-spacing:.02em;color:var(--ink-2);position:sticky;top:0}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--paper-2)}
td.k{font-weight:600;color:var(--ink);white-space:nowrap}

/* ---------- pigment chips ---------- */
.chip{display:inline-block;font-size:11.5px;font-family:'IBM Plex Mono',monospace;padding:1px 7px;border-radius:99px;font-weight:500;white-space:nowrap}
.c-green{background:var(--green-soft);color:var(--green)}
.c-brown{background:var(--brown-soft);color:var(--brown)}
.c-red{background:var(--red-soft);color:var(--red)}
.c-gold{background:var(--gold-soft);color:var(--gold)}
.c-fire{background:var(--fire-soft);color:var(--fire)}
.c-teal{background:var(--teal-soft);color:var(--teal)}
.c-violet{background:var(--violet-soft);color:var(--violet)}

/* ---------- boxes ---------- */
.box{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:16px 18px;margin:16px 0;box-shadow:var(--shadow)}
.patch{border-left:4px solid var(--red);background:var(--card);border-radius:0 10px 10px 0;padding:16px 18px;margin:18px 0;
  border-top:1px solid var(--rule);border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);box-shadow:var(--shadow)}
.patch>.ttl{font-family:'Noto Serif Bengali',serif;font-weight:700;font-size:16.5px;color:var(--red);margin-bottom:10px;display:block}
.patch dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14.5px}
.patch dt{font-weight:600;color:var(--ink-2);white-space:nowrap;font-size:13px;padding-top:2px}
.patch dd{margin:0}
.hook{border-left:4px solid var(--gold);background:var(--gold-soft);border-radius:0 8px 8px 0;padding:10px 14px;margin:12px 0;font-size:14.5px}
.hook b{color:var(--gold)}
.warn{border-left:4px solid var(--fire);background:var(--fire-soft);border-radius:0 8px 8px 0;padding:10px 14px;margin:12px 0;font-size:14.5px}
.gap{border:1px dashed var(--rule-2);border-radius:8px;padding:10px 14px;margin:12px 0;font-size:13.5px;color:var(--ink-3);background:var(--paper-2)}

/* ---------- trees / maps ---------- */
.tree{font-size:14.5px;line-height:1.85;margin:14px 0;padding-left:2px}
.tree ul{list-style:none;margin:0;padding-left:20px;border-left:1px solid var(--rule-2)}
.tree>ul{padding-left:0;border-left:0}
.tree li{position:relative;padding-left:16px}
.tree>ul>li{padding-left:0}
.tree li::before{content:"";position:absolute;left:0;top:.95em;width:11px;height:1px;background:var(--rule-2)}
.tree>ul>li::before{display:none}
.tree .node{font-weight:600;color:var(--ink)}
.tree .root{font-family:'Noto Serif Bengali',serif;font-weight:700;font-size:17px;color:var(--green);display:block;margin-bottom:4px}

/* ---------- profile cards ---------- */
.prof{background:var(--card);border:1px solid var(--rule);border-radius:12px;margin:22px 0;overflow:hidden;box-shadow:var(--shadow)}
.prof-h{background:var(--paper-2);padding:13px 18px;border-bottom:1px solid var(--rule);display:flex;flex-wrap:wrap;gap:10px;align-items:baseline}
.prof-h .nm{font-family:'Source Serif 4',serif;font-style:italic;font-weight:600;font-size:20px;color:var(--green)}
.prof-h .bn{color:var(--ink-2);font-size:14px}
.prof-b{padding:6px 18px 16px}
.prof-b dl{display:grid;grid-template-columns:minmax(110px,auto) 1fr;gap:0;font-size:14.5px;margin:0}
.prof-b dt{font-weight:600;color:var(--ink-2);padding:7px 14px 7px 0;border-bottom:1px solid var(--rule);font-size:13.5px}
.prof-b dd{margin:0;padding:7px 0;border-bottom:1px solid var(--rule)}
.prof-b dl>*:nth-last-child(-n+2){border-bottom:0}
.link-chain{font-size:14px;font-family:'IBM Plex Mono',monospace;background:var(--paper-2);border-radius:8px;padding:11px 14px;margin:12px 0;line-height:2;color:var(--ink-2)}
.link-chain b{color:var(--green);font-family:'Hind Siliguri',sans-serif}

/* ---------- misc ---------- */
ul.plain{margin:10px 0;padding-left:22px}
ul.plain li{margin:5px 0}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin:16px 0}
.stat{display:flex;gap:12px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--rule)}
.stat:last-child{border-bottom:0}
.stat .v{font-family:'IBM Plex Mono',monospace;font-weight:600;color:var(--green);font-size:15px;min-width:88px;font-variant-numeric:tabular-nums}
.star{color:var(--fire);font-weight:700;font-size:12px;letter-spacing:-1px}
hr.soft{border:0;border-top:1px solid var(--rule);margin:30px 0}
.toplink{display:inline-block;font-size:12px;font-family:'IBM Plex Mono',monospace;color:var(--ink-3);text-decoration:none;margin-top:26px}
.toplink:hover{color:var(--green)}
footer{margin-top:70px;padding-top:22px;border-top:1px solid var(--rule);color:var(--ink-3);font-size:13.5px}
@media (max-width:560px){
  body{font-size:16px}
  .prof-b dl{grid-template-columns:1fr}
  .prof-b dt{border-bottom:0;padding-bottom:0}
  .patch dl{grid-template-columns:1fr;gap:2px 0}
  .patch dt{margin-top:8px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<!--
  ── HOW TO USE THIS FILE ────────────────────────────────────────────────
  This is the <head> + CSS half of a memory-map page. Copy it verbatim as
  the first chunk of a new page, change the <title>, then append your
  <header class="mast">, <nav>, <div class="wrap">, the fifteen
  <section class="part"> blocks, </div> and <footer>.

  Class vocabulary you can rely on:
    .mast / .mast-in / .eyebrow / .src     masthead
    nav > .nav-in > a                      sticky part-jump chips
    .part / .part-head / .part-no / .lede  a numbered part
    .ref                                   [স্লা.১২ · পৃ.১৯৬] source pill
    .tw > table                            any table (adds horizontal scroll)
    td.k                                   the key/label column of a table
    .chip .c-green|c-brown|c-red|c-gold|c-fire|c-teal|c-violet   pigment chips
    .box / .two                            plain card / responsive 2-col grid
    .patch > .ttl + dl                     a PATCH card (Part 06)
    .hook / .warn / .gap                   memory hook / trap / missing-data note
    .tree > ul                             indented concept tree
    .prof > .prof-h(.nm,.bn) + .prof-b>dl  one-organism profile card
    .link-chain                            the arrow chain under a profile
    .stat > .v + text                      number row
    .num / .mono                           tabular figures
    .star                                  ★ emphasis marker
    .toplink                               "↑ উপরে" back link

  The palette is themed through CSS variables in :root, redefined for
  prefers-color-scheme:dark and [data-theme="dark"]. Never hardcode a colour
  inside a media query — always add the token to all three blocks.

  The accent colours are derived from real algal pigments (green/brown/red/
  gold/fire/teal). For a different chapter, retune those six --c-* values to
  something the subject actually owns, so the page never looks generic.
-->
