<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} · পড়া</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
{{BASE_CSS}}
nav.tabs{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:6px;overflow-x:auto;
  padding:10px 0 4px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:0 0 auto;font:inherit;font-size:.95rem;border:1px solid var(--line);
  background:var(--card);color:var(--ink);border-radius:10px;padding:6px 12px;cursor:pointer}
nav.tabs button[aria-selected="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
.stick2{position:sticky;top:50px;z-index:4;background:var(--bg);border-bottom:1px solid var(--line)}
.goq{margin-top:8px}
.q{cursor:pointer}
.q.marked{border-left:4px solid var(--err)}
.qhead{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:.78rem;color:var(--muted);margin-bottom:4px}
.qtext{font-weight:600;font-size:1.02rem}
.opts{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:6px}
.opts li{border:1px solid var(--line);border-radius:10px;padding:6px 10px;cursor:pointer}
.opts li.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:600}
.opts li.wrong{background:var(--err-soft);border-color:var(--err);color:var(--err);text-decoration:line-through}
.hint{font-size:.8rem;color:var(--muted);margin-top:8px}
.ans{display:none;margin-top:10px}
.q.open .ans{display:block}
.q.open .hint{display:none}
.selfmark{display:flex;gap:8px;margin-top:10px}
.selfmark button{font:inherit;font-size:.85rem;border-radius:8px;padding:4px 12px;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.selfmark .on-ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.selfmark .on-bad{background:var(--err-soft);border-color:var(--err);color:var(--err)}
.secfilter{display:inline-flex;gap:6px;align-items:center;font-size:.85rem;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:2px 4px 2px 10px}
.secfilter button{border:0;background:transparent;color:inherit;font:inherit;cursor:pointer}
.mist li{margin:4px 0}
.hintbtn{margin-top:8px}
.q .hintbox{display:none}
.q.hinted .hintbox,.q.open .hintbox{display:block}
.q.hinted .hintbtn,.q.open .hintbtn{display:none}
.vzbtn{margin-top:8px;margin-left:6px}
.q .vzhint{display:none}
.q.vzon .vzhint{display:block}
.q.vzon .vzbtn,.q.open .vzbtn,.q.open .vzhint{display:none}
.clue{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:start;padding:8px 0;border-bottom:1px solid var(--line)}
.clue .c{font-weight:600}
.clue .c mark{background:#fff59d;color:#1f2328;border-radius:3px;padding:0 3px}
.clue .a{cursor:pointer}
.clue .a .v{filter:blur(6px);transition:filter .2s}
.clue .a.show .v{filter:none}
.clue .sub{grid-column:1/-1;font-size:.82rem;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title"></h1>
    <div class="sub" id="subtitle"></div>
    <div id="vnav"></div>
    <div class="stats" id="stats"></div>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="notes" aria-selected="true">📘 নোট</button>
    <button role="tab" data-tab="why" aria-selected="false">🧠 কেন + কৌশল + গল্প</button>
    <button role="tab" data-tab="practice" aria-selected="false">❓ প্র্যাকটিস</button>
    <button role="tab" data-tab="clues" aria-selected="false">🔑 ক্লু</button>
    <button role="tab" data-tab="roots" aria-selected="false">🔤 শব্দমূল</button>
    <button role="tab" data-tab="mistakes" aria-selected="false">🔴 ভুল-প্রবণ</button>
  </nav>
  <div class="stick2"><div class="chips" id="topics"></div></div>

  <section id="tab-notes">
    <div class="chips"><button class="chip" id="recallBtn" aria-pressed="false">🙈 রিকল মোড: মূল শব্দ লুকাও</button></div>
    <div id="notes"></div>
  </section>
  <section id="tab-why" hidden><div id="why"></div></section>
  <section id="tab-practice" hidden>
    <div class="chips" id="filters">
      <button class="chip" data-f="all" aria-pressed="true">সব</button>
      <button class="chip" data-f="marked" aria-pressed="false">🔴 দাগানো</button>
      <button class="chip" data-f="bad" aria-pressed="false">❌ পারিনি</button>
      <button class="chip" data-f="new" aria-pressed="false">⬜ দেখিনি</button>
      <button class="chip" id="shuffleBtn">🔀 এলোমেলো</button>
      <button class="chip" id="resetBtn">↺ রিসেট</button>
    </div>
    <div id="secfilterBox"></div>
    <div id="practice"></div>
  </section>
  <section id="tab-clues" hidden>
    <p class="muted" style="font-size:.9rem">প্রশ্নে এই শব্দটা দেখলেই উত্তরটা মনে পড়বে। আগে বাম দিকের শব্দটা পড়ো, উত্তর মনে মনে ভাবো, তারপর ডানে ট্যাপ করো।</p>
    <div id="clues"></div>
  </section>
  <section id="tab-roots" hidden>
    <p class="muted" style="font-size:.9rem">শব্দটা ভেঙে দেখো। গ্রিক বা ল্যাটিন মূলের মানে জানলে তথ্যটা নিজে থেকেই মনে থাকে, আর একই মূল অন্য অধ্যায় আর মেডিকেলেও বারবার আসে। সব অধ্যায়ের মূল একসাথে পাবে <a href="roots.html">🔤 শব্দমূল অভিধানে</a>।</p>
    <div id="roots"></div>
  </section>
  <section id="tab-mistakes" hidden><div id="mistakes"></div></section>
</div>

<script>
{{DATA_JS}}
{{COMMON_JS}}
(function(){
  let state = STORE.load(), filter = "all", topic = "all", secOnly = null;
  let order = CHAPTER.questions.map((_, i) => i);
  $("#title").textContent = CHAPTER.title;
  $("#subtitle").textContent = CHAPTER.subtitle;
  $("#vnav").innerHTML = versionNav("study");
  $("#topics").innerHTML = topicChips("all");

  const inTopic = s => topic === "all" || s.topic === topic;
  const qCount = id => CHAPTER.questions.filter(q => q.section === id).length;
  const fig = f => f ? `<figure>${f.svg || `<img src="${f.src}" alt="">`}${f.caption ? `<figcaption>${f.caption}</figcaption>` : ""}</figure>` : "";

  function grouped(render) {
    return CHAPTER.topics.filter(t => topic === "all" || t.id === topic).map(t =>
      `<h2 class="topic-h">${t.icon} ${t.name}</h2>` +
      CHAPTER.sections.filter(s => s.topic === t.id).map(render).join("")).join("");
  }
  function renderNotes() {
    $("#notes").innerHTML = grouped(s => `
      <article class="card" id="n-${s.id}">
        <h2>${s.heading}</h2>${fig(s.figure)}<p>${s.note}</p>
        ${termChips(s.id)}
        <button class="chip goq" data-sec="${s.id}">❓ এই অংশের ${qCount(s.id)}টি প্রশ্ন →</button>
      </article>`);
  }
  const TERMS = CHAPTER.terms || [];
  function termChips(sid) {
    const ts = TERMS.map((t, i) => [t, i]).filter(([t]) => t.s === sid);
    return ts.length ? `<div class="termchips"><span class="muted" style="font-size:.85rem">🔤 শব্দ ভাঙো:</span>${ts.map(([t, i]) => `<button class="chip goterm" data-ti="${i}">${t.t.split(" / ")[0]}</button>`).join("")}</div>` : "";
  }
  function renderRoots() {
    $("#roots").innerHTML = grouped(s => {
      const ts = TERMS.map((t, i) => [t, i]).filter(([t]) => t.s === s.id);
      return ts.length ? `<article class="card"><h2>${s.heading}</h2>${ts.map(([t, i]) => termHTML(t, "term-" + i)).join("")}</article>` : "";
    });
  }
  function renderWhy() {
    $("#why").innerHTML = grouped(s => `
      <article class="card"><h2>${s.heading}</h2>
        ${s.why ? `<div class="box why"><b class="t">🤔 কেন এমন?</b>${s.why}</div>` : ""}
        ${s.mnemonic ? `<div class="box mn"><b class="t">🧠 মনে রাখার কৌশল</b>${s.mnemonic}</div>` : ""}
        ${s.story ? `<div class="box story"><b class="t">🎬 গল্পটা চোখে দেখো</b>${s.story}</div>` : ""}
        ${s.traps && s.traps.length ? `<div class="box trap"><b class="t">🪤 MCQ ফাঁদ / এলিমিনেশন</b><ul>${s.traps.map(t => `<li>${t}</li>`).join("")}</ul></div>` : ""}
        <button class="chip goq" data-sec="${s.id}">❓ এই অংশের ${qCount(s.id)}টি প্রশ্ন →</button>
      </article>`);
  }
  function visible(q) {
    if (secOnly && q.section !== secOnly) return false;
    if (!secOnly && topic !== "all" && q.topic !== topic) return false;
    if (filter === "marked") return q.marked;
    if (filter === "bad") return state[q.n] === "bad";
    if (filter === "new") return !state[q.n];
    return true;
  }
  function qCard(q) {
    return `<article class="card q${q.marked ? " marked" : ""}" data-n="${q.n}">
      <div class="qhead"><b>প্রশ্ন ${q.n}</b><span class="pill">${q.src}</span>${q.bookMarked ? `<span class="pill" style="color:var(--err)">🔴 আগে ভুল</span>` : `<button class="pill own" data-own style="cursor:pointer;font:inherit;font-size:.78rem;color:${q.marked ? "var(--err)" : "var(--muted)"};background:var(--card)">${q.marked ? "🔴 ভুল-প্রবণ ✕" : "➕ ভুল করি"}</button>`}${state[q.n] === "ok" ? "✅" : state[q.n] === "bad" ? "❌" : ""}</div>
      <div class="qtext">${markCue(q.q, q.cue)}</div>
      <ol class="opts">${q.options.map((o, j) => `<li data-j="${j}">(${LETTERS[j]}) ${q.q.includes(q.cue) ? o : markCue(o, q.cue)}</li>`).join("")}</ol>
      ${q.hint ? `<button class="chip hintbtn" data-hint>💡 হিন্ট দাও (উত্তর না)</button><div class="box hintbox"><b class="t">🔑 ক্লু: হলুদ শব্দটা দেখো</b>${q.hint}</div>` : ""}
      ${q.v ? `<button class="chip vzbtn" data-vz>🖼️ ছবি-হিন্ট</button><div class="vzhint">${VIS.render(q, "hint")}</div>` : ""}
      <div class="hint">👆 অপশনে বা প্রশ্নে ট্যাপ করলে উত্তর দেখাবে</div>
      <div class="ans">
        ${q.v ? VIS.render(q, "full") : ""}
        ${q.why ? `<div class="box why"><b class="t">✅ কেন</b>${q.why}</div>` : ""}
        ${q.elim ? `<div class="box trap"><b class="t">✂️ এলিমিনেশন</b>${q.elim}</div>` : ""}
        <div class="selfmark"><button data-mark="ok" class="${state[q.n] === "ok" ? "on-ok" : ""}">✅ পেরেছি</button><button data-mark="bad" class="${state[q.n] === "bad" ? "on-bad" : ""}">❌ পারিনি</button></div>
      </div></article>`;
  }
  function renderPractice() {
    $("#secfilterBox").innerHTML = secOnly ? `<span class="secfilter">অংশ: ${SEC[secOnly].heading.slice(0, 40)}… <button id="clearSec" aria-label="অংশ ফিল্টার সরাও">✕</button></span>` : "";
    const list = order.map(i => CHAPTER.questions[i]).filter(visible);
    $("#practice").innerHTML = list.length ? `<div class="muted" style="font-size:.85rem">${list.length}টি প্রশ্ন</div>` + list.map(qCard).join("") : `<div class="empty">এই ফিল্টারে কোনো প্রশ্ন নেই 🎉</div>`;
    renderStats();
  }
  function renderMistakes() {
    const html = grouped(s => {
      const d = document.createElement("div"); d.innerHTML = s.note;
      const bits = $$(".err", d).filter(e => !e.parentElement.closest(".err")).map(e => `<li><span class="err">${e.innerHTML}</span></li>`);
      const qs = CHAPTER.questions.filter(q => q.section === s.id && (q.marked || state[q.n] === "bad"));
      if (!bits.length && !qs.length) return "";
      return `<article class="card"><h2>${s.heading}</h2>
        ${bits.length ? `<ul class="mist">${bits.join("")}</ul>` : ""}
        ${qs.length ? `<div class="box trap"><b class="t">❌ এই অংশের ভুল-প্রবণ প্রশ্ন (${qs.length})</b><ul class="mist">${qs.map(q => `<li><b>${q.n}.</b> ${q.q}<br>✅ <b>${q.options[q.answer]}</b></li>`).join("")}</ul></div>` : ""}
      </article>`;
    });
    $("#mistakes").innerHTML = html || `<div class="empty">কিছু নেই</div>`;
  }
  function renderStats() {
    const t = CHAPTER.questions.length, v = Object.values(state);
    $("#stats").innerHTML = `<span class="pill">মোট প্রশ্ন ${t}</span><span class="pill">✅ ${v.filter(x => x === "ok").length}</span><span class="pill">❌ ${v.filter(x => x === "bad").length}</span><span class="pill">🔴 দাগানো ${CHAPTER.questions.filter(q => q.marked).length}</span>`;
  }
  function renderClues() {
    $("#clues").innerHTML = grouped(s => {
      const qs = CHAPTER.questions.filter(q => q.section === s.id && q.cue);
      if (!qs.length) return "";
      return `<article class="card"><h2>${s.heading}</h2>${qs.map(q => `
        <div class="clue"><div class="c">"<mark>${q.cue}</mark>"</div><div>→</div>
        <div class="a" tabindex="0"><span class="v">✅ ${q.options[q.answer]}</span></div>
        <div class="sub">#${q.n} ${q.q.length > 70 ? q.q.slice(0, 70) + "…" : q.q} · 💡 ${q.hint}</div></div>`).join("")}</article>`;
    });
  }
  function renderAll() { renderNotes(); renderWhy(); renderPractice(); renderClues(); renderRoots(); renderMistakes(); }

  function showTab(name) {
    $$("nav.tabs button").forEach(x => x.setAttribute("aria-selected", x.dataset.tab === name));
    ["notes", "why", "practice", "clues", "roots", "mistakes"].forEach(t => $("#tab-" + t).hidden = t !== name);
    try { sessionStorage.setItem("tab:" + CHAPTER.id, name); } catch (e) {}
    window.scrollTo({ top: 0 });
  }
  $$("nav.tabs button").forEach(b => b.onclick = () => showTab(b.dataset.tab));
  $("#topics").addEventListener("click", e => {
    const b = e.target.closest("[data-topic]"); if (!b) return;
    topic = b.dataset.topic; secOnly = null;
    $$("#topics [data-topic]").forEach(x => x.setAttribute("aria-pressed", x === b));
    renderAll();
  });
  document.addEventListener("click", e => {
    const g = e.target.closest(".goq"); if (g) { secOnly = g.dataset.sec; filter = "all"; $$("[data-f]").forEach(x => x.setAttribute("aria-pressed", x.dataset.f === "all")); renderPractice(); showTab("practice"); return; }
    if (e.target.id === "clearSec") { secOnly = null; renderPractice(); return; }
    const gt = e.target.closest(".goterm");
    if (gt) { showTab("roots"); const el = document.getElementById("term-" + gt.dataset.ti); if (el) { el.scrollIntoView({ block: "center" }); el.style.outline = "3px solid #f9a825"; setTimeout(() => el.style.outline = "", 1800); } return; }
    const a = e.target.closest(".clue .a"); if (a) { a.classList.toggle("show"); return; }
    const k = e.target.closest("body.recall .k"); if (k) k.classList.toggle("show");
  });
  $("#practice").addEventListener("click", e => {
    const card = e.target.closest(".q"); if (!card) return;
    const n = +card.dataset.n, q = CHAPTER.questions.find(x => x.n === n);
    if (e.target.closest("[data-own]")) {
      if (OWN[n]) delete OWN[n]; else OWN[n] = 1;
      MARKS.save(OWN); q.marked = !!OWN[n];
      renderPractice(); renderMistakes(); return;
    }
    if (e.target.closest("[data-hint]")) { card.classList.add("hinted", "showcue"); return; }
    if (e.target.closest("[data-vz]")) { card.classList.add("vzon"); return; }
    const mb = e.target.closest("[data-mark]");
    if (mb) {
      state[n] = mb.dataset.mark; STORE.save(state);
      $$("[data-mark]", card).forEach(b => b.className = "");
      mb.className = mb.dataset.mark === "ok" ? "on-ok" : "on-bad";
      renderStats(); renderMistakes(); return;
    }
    if (card.classList.contains("open")) return;
    const li = e.target.closest(".opts li"), chosen = li ? +li.dataset.j : -1;
    card.classList.add("open", "showcue");
    $$(".opts li", card).forEach(l => { const j = +l.dataset.j; if (j === q.answer) l.classList.add("right"); else if (j === chosen) l.classList.add("wrong"); });
    if (chosen >= 0 && !state[n]) { state[n] = chosen === q.answer ? "ok" : "bad"; STORE.save(state);
      $$("[data-mark]", card).forEach(b => b.className = b.dataset.mark === state[n] ? (state[n] === "ok" ? "on-ok" : "on-bad") : ""); renderStats(); renderMistakes(); }
  });
  $("#filters").addEventListener("click", e => {
    const b = e.target.closest("[data-f]"); if (!b) return;
    filter = b.dataset.f; $$("[data-f]").forEach(x => x.setAttribute("aria-pressed", x === b)); renderPractice();
  });
  $("#shuffleBtn").onclick = () => { order.sort(() => Math.random() - .5); renderPractice(); };
  $("#resetBtn").onclick = () => { if (confirm("সব ✅/❌ মুছে ফেলবে?")) { state = {}; STORE.save(state); renderPractice(); renderMistakes(); } };
  $("#recallBtn").onclick = function () { const on = document.body.classList.toggle("recall"); this.setAttribute("aria-pressed", on); $$(".k.show").forEach(k => k.classList.remove("show")); };

  renderAll();
  try { const t = sessionStorage.getItem("tab:" + CHAPTER.id); if (t) showTab(t); } catch (e) {}
})();
</script>
</body>
</html>
